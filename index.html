<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0">
    <title>L A Y E R : S</title>

    <link rel="stylesheet" href="style.css">
    <script src="js/main.js" type="module" defer></script>
</head>

<body>
    <div id="title-screen">

        <h1 id="logo-container">
            <img src="logo.png" id="logo">
        </h1>

        <div id="menu">

            <div class="menu-item selected" data-menu="play">
                PLAY
            </div>

            <div class="menu-item" data-menu="user-map">
                USER MAP
            </div>

            <div class="menu-item" data-menu="map-maker">
                MAP MAKER
            </div>

            <div class="menu-item" data-menu="color-textures">
                TEXTURES: ON
            </div>

        </div>

        <div id="menu-helper">
            <span>↑ ↓</span>
            <span>MOVE</span>

            <span>ENTER</span>
            <span>SELECT</span>
        </div>

    </div>
    <div id="game-screen">
        <canvas id="canvas"></canvas>
    </div>

    <dialog id="user-map-dialog" aria-labelledby="user-map-title">
        <form id="user-map-form">
            <h2 id="user-map-title">USER MAP</h2>
            <label for="user-map-input">Enter a map number or paste a share link:</label>
            <input id="user-map-input" type="text" autocomplete="off" required>
            <p id="user-map-error" role="alert" hidden></p>
            <div class="user-map-actions">
                <button id="cancel-user-map-button" type="button">CANCEL</button>
                <button id="load-user-map-button" type="submit">LOAD MAP</button>
            </div>
        </form>
    </dialog>
</body>

</html>
