<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>L A Y E R : S — Map Editor</title>

    <link rel="stylesheet" href="./editor.css">

</head>

<body>

    <main id="editor">

        <!-- Editor header -->

        <header id="editor-header">
            <a href="index.html">
                <h1>
                    L A Y E R : S
                </h1>
            </a>

            <span>
                MAP EDITOR
            </span>
            <button id="test-button" type="button">TEST MAP <span aria-hidden="true">↗</span></button>

        </header>


        <!-- Editor body -->

        <section id="editor-body">

            <!-- Left palette -->

            <aside id="palette">

                <!-- Object selection -->

                <section id="object-palette">

                    <div class="palette-title">
                        OBJECT
                    </div>

                    <button class="object-button selected" data-object="." data-key="1">
                        <span class="object-number">1</span>
                        <span class="object-symbol">.</span>
                        <span class="object-name">AIR</span>
                    </button>

                    <button class="object-button" data-object="#" data-key="2">
                        <span class="object-number">2</span>
                        <span class="object-symbol">#</span>
                        <span class="object-name">BLOCK</span>
                    </button>

                    <button class="object-button" data-object="^" data-key="3">
                        <span class="object-number">3</span>
                        <span class="object-symbol">^</span>
                        <span class="object-name">SPIKE</span>
                    </button>

                    <button class="object-button" data-object="O" data-key="4">
                        <span class="object-number">4</span>
                        <span class="object-symbol">O</span>
                        <span class="object-name">MINI BLACKHOLE</span>
                    </button>

                    <button class="object-button" data-object="@" data-key="5">
                        <span class="object-number">5</span>
                        <span class="object-symbol">@</span>
                        <span class="object-name">PLAYER</span>
                    </button>

                    <button class="object-button" data-object="$" data-key="6">
                        <span class="object-number">6</span>
                        <span class="object-symbol">$</span>
                        <span class="object-name">GOAL</span>
                    </button>

                </section>


                <!-- Divider -->

                <div class="palette-divider"></div>


                <!-- Color selection -->

                <section id="color-palette">

                    <div class="palette-title">
                        COLOR
                    </div>



                    <button class="color-button selected" data-color="W" aria-label="White">
                        <span class="color-swatch color-white"></span>
                        <span>W</span>
                    </button>

                    <button class="color-button" data-color="R" aria-label="Red">
                        <span class="color-swatch color-red"></span>
                        <span>R</span>
                    </button>

                    <button class="color-button" data-color="G" aria-label="Green">
                        <span class="color-swatch color-green"></span>
                        <span>G</span>
                    </button>

                    <button class="color-button" data-color="B" aria-label="Blue">
                        <span class="color-swatch color-blue"></span>
                        <span>B</span>
                    </button>

                    <button class="color-button" data-color="Y" aria-label="Yellow">
                        <span class="color-swatch color-yellow"></span>
                        <span>Y</span>
                    </button>

                    <button class="color-button" data-color="M" aria-label="Magenta">
                        <span class="color-swatch color-magenta"></span>
                        <span>M</span>
                    </button>

                    <button class="color-button" data-color="C" aria-label="Cyan">
                        <span class="color-swatch color-cyan"></span>
                        <span>C</span>
                    </button>

                </section>

            </aside>


            <!-- Map area -->

            <section id="map-editor">

                <div id="map-edit-controls" aria-label="Editor tools">
                    <div id="map-tool-controls" role="group" aria-label="Drawing tool">
                        <button type="button" data-editor-tool="brush" aria-pressed="true">BRUSH</button>
                        <button type="button" data-editor-tool="rectangle" aria-pressed="false">RECT</button>
                        <button type="button" data-editor-tool="select" aria-pressed="false">SELECT</button>
                    </div>
                    <div id="map-history-controls" role="group" aria-label="Edit history">
                        <button id="undo-button" type="button" title="Undo (Ctrl+Z)" aria-label="Undo last edit" disabled>↶ <span>UNDO</span></button>
                        <button id="redo-button" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo last edit" disabled>↷ <span>REDO</span></button>
                    </div>
                    <div id="map-clipboard-controls" role="group" aria-label="Copy and paste selection">
                        <button id="copy-selection-button" type="button" title="Copy selection (Ctrl+C / Cmd+C)" disabled>COPY</button>
                        <button id="paste-selection-button" type="button" title="Paste selection (Ctrl+V / Cmd+V)" disabled>PASTE</button>
                    </div>
                    <div id="map-view-controls" aria-label="Map view controls">
                        <button id="pan-mode-button" type="button" aria-pressed="false">
                            PAN: OFF
                        </button>
                        <button id="center-view-button" type="button">
                            CENTER
                        </button>
                    </div>

                </div>
                <div id="canvas-viewport" aria-label="Map workspace">
                    <canvas id="map-canvas" aria-label="Map editing canvas"></canvas>
                </div>
                <p id="clipboard-status" role="status" aria-live="polite">Choose a tool and draw. SELECT an area to copy and paste.</p>

            </section>

        </section>


        <!-- Bottom controls -->

        <footer id="editor-footer">

            <div id="map-size-controls">

                <label>
                    <span>W</span>
                    <input id="map-width-input" type="number" min="1" max="128" value="16">
                </label>

                <label>
                    <span>H</span>
                    <input id="map-height-input" type="number" min="1" max="128" value="16">
                </label>

                <button id="resize-button">
                    RESIZE
                </button>

            </div>

            <div id="editor-actions-wrap">
                <button id="editor-menu-toggle" type="button" aria-expanded="false" aria-controls="editor-actions-menu">MAP ACTIONS <span aria-hidden="true">⌃</span></button>

                <div id="editor-actions-menu" aria-label="Map actions">
                    <button
                        id="texture-toggle-button"
                        class="texture-toggle-button"
                        type="button"
                        aria-pressed="true"
                    >
                        TEXTURES: ON
                    </button>
                    <button id="clear-button" type="button">
                        CLEAR
                    </button>

                    <button id="save-button" type="button">
                        SAVE
                    </button>

                    <button id="load-button" type="button">
                        LOAD
                    </button>

                    <button id="load-code-button" type="button">
                        LOAD WITH CODE
                    </button>

                    <button id="copy-button" type="button">
                        COPY CODE
                    </button>


                </div>
            </div>

        </footer>
        <p id="autosave-status" role="status" aria-live="polite">Autosave ready · this browser only.</p>

    </main>

    <dialog id="load-code-dialog" aria-labelledby="load-code-title">
        <div class="load-code-content">
            <h2 id="load-code-title">LOAD WITH CODE</h2>
            <label for="load-code-input">Paste map code:</label>
            <textarea id="load-code-input" rows="12" spellcheck="false"></textarea>
            <p id="load-code-error" role="alert" hidden></p>
            <div class="load-code-actions">
                <button id="cancel-load-code-button" type="button">CANCEL</button>
                <button id="submit-load-code-button" type="button">LOAD MAP</button>
            </div>
        </div>
    </dialog>

    <dialog id="clear-map-dialog" aria-labelledby="clear-map-title">
        <div class="load-code-content">
            <h2 id="clear-map-title">CLEAR MAP?</h2>
            <p>Clear all objects from the current map? You can restore it with UNDO.</p>
            <div class="load-code-actions">
                <button id="cancel-clear-map-button" type="button">CANCEL</button>
                <button id="confirm-clear-map-button" type="button">CLEAR MAP</button>
            </div>
        </div>
    </dialog>

    <section id="game-preview" aria-label="Map preview" aria-hidden="true">
        <canvas id="preview-canvas"></canvas>
        <div id="preview-touch-controls" aria-label="Test play touch controls">
            <button type="button" data-preview-control="left" aria-label="Move left">◀</button>
            <button type="button" data-preview-control="right" aria-label="Move right">▶</button>
            <button type="button" data-preview-control="layer">LAYER</button>
            <button type="button" data-preview-control="jump">JUMP</button>
        </div>
        <button id="return-editor-button" type="button">BACK TO EDITOR <span>ESC</span></button>
    </section>


    <script type="module" src="./js/editor.js"></script>

</body>

</html>
